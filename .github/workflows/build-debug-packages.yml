name: Build Debug EXE and APK

on:
  workflow_dispatch:

jobs:
  build-windows-debug-exe:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Windows packaging dependencies
        working-directory: packaging/windows
        run: npm install

      - name: Build Debug Portable EXE
        working-directory: packaging/windows
        run: npm run pack:debug

      - name: Upload StoryBridge-Studio-Debug.exe
        uses: actions/upload-artifact@v4
        with:
          name: StoryBridge-Studio-Debug-EXE
          path: packaging/windows/dist/StoryBridge-Studio-Debug.exe

  build-android-debug-apk:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK licenses accepted (preinstalled SDK)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Android packaging dependencies
        working-directory: packaging/android
        run: npm install

      - name: Prepare Capacitor Android project
        working-directory: packaging/android
        run: npm run prepare:android

      - name: Build Debug APK
        working-directory: packaging/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: StoryBridge-Studio-Debug-APK
          path: packaging/android/android/app/build/outputs/apk/debug/app-debug.apk
