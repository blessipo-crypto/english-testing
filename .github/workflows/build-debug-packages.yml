name: Build Debug EXE and APK

on:
  workflow_dispatch:

jobs:
  build-windows-debug-exe:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies and build web bundle
        shell: bash
        run: |
          npm install
          VITE_BASE=./ npm run build
          rm -rf packaging/windows/dist-web
          cp -r dist packaging/windows/dist-web

      - name: Install Windows packaging dependencies
        working-directory: packaging/windows
        run: npm install

      - name: Build Debug Portable EXE
        working-directory: packaging/windows
        run: npm run pack:debug

      - name: Upload StoryBridge-Studio-Debug.exe
        uses: actions/upload-artifact@v4
        with:
          name: StoryBridge-Studio-Debug-EXE
          path: packaging/windows/dist/StoryBridge-Studio-Debug.exe

  build-android-debug-apk:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK licenses accepted
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          echo -e "\n24333f8a6383ba7ea0330724a82736a823775424\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e176f5a" > "$SDK_ROOT/licenses/intel-android-extra-license"
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -exec bash -c 'yes | "$1" --licenses >/dev/null 2>&1 || true' _ {} \;
          fi

      - name: Install root dependencies and build web bundle
        run: |
          npm install
          VITE_BASE=./ npm run build
          rm -rf packaging/android/www
          cp -r dist packaging/android/www

      - name: Install Android packaging dependencies
        working-directory: packaging/android
        run: npm install

      - name: Prepare Capacitor Android project
        working-directory: packaging/android
        run: npm run prepare:android

      - name: Build Debug APK
        working-directory: packaging/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: StoryBridge-Studio-Debug-APK
          path: packaging/android/android/app/build/outputs/apk/debug/app-debug.apk
